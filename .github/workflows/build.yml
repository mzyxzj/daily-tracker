name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要写 Release 才能把 APK 挂上去
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 不再在项目根跑 `flutter create .`：那一步会重写 pubspec.yaml，
      # 也是上一轮「asset 找不到」的源头。改成在临时目录生成 android 壳再拷回，
      # 仓库里的 pubspec.yaml / lib / assets 一律不被动。
      - name: Generate Android shell in temp dir
        run: |
          set -e
          SHELL_DIR="$RUNNER_TEMP/shell"
          rm -rf "$SHELL_DIR"
          flutter create --project-name daily_tracker --platforms android "$SHELL_DIR" > /dev/null
          test -d "$SHELL_DIR/android"
          rm -rf "$GITHUB_WORKSPACE/android"
          cp -r "$SHELL_DIR/android" "$GITHUB_WORKSPACE/android"
          test -f "$GITHUB_WORKSPACE/android/app/build.gradle.kts" \
            || test -f "$GITHUB_WORKSPACE/android/app/build.gradle"
          echo "android/ generated from template"

      # 「复制链接就弹窗」必须由系统级的无障碍服务做（Android 10+ 后台读不到剪贴板）。
      # 仓库里不带 android/ 目录，所以在壳生成之后把 Kotlin 服务和 manifest 改进去。
      - name: Inject clipboard accessibility service
        run: |
          python3 .android-inject/patch.py
          echo '--- manifest head ---'
          sed -n '1,12p' android/app/src/main/AndroidManifest.xml

      # 防御：资源已改为 Dart 常量，不再需要 asset bundle。
      # 万一仓库里的 pubspec.yaml 还留着旧的 assets 声明，构建前直接剥掉，
      # 避免 aot_android_asset_bundle 因缺文件整包失败。
      - name: Strip stale asset declarations
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(r'(?m)^[ \t]*assets:[ \t]*\n(?:[ \t]*-[ \t]*\S.*\n?)*', '', s)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
              print('stripped stale assets: declaration')
          else:
              print('pubspec has no assets declaration')
          print('--- pubspec.yaml ---')
          print(p.read_text(encoding='utf-8'))
          PY

      # DeepSeek 反思分析改为 App 内直接调用 HTTPS API，
      # release 包的 main AndroidManifest 默认不带 INTERNET 权限，需在此注入。
      - name: Grant INTERNET permission for DeepSeek API
        run: |
          cat > /tmp/add_permission.py <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android.permission.INTERNET' not in s:
              perm = '    <uses-permission android:name="android.permission.INTERNET"/>'
              s = re.sub(r'(<manifest[^>]*>)', lambda m: m.group(1) + '\n' + perm, s, count=1)
              open(p, 'w', encoding='utf-8').write(s)
              print('INTERNET permission added')
          else:
              print('INTERNET permission already present')
          PY
          python3 /tmp/add_permission.py
          head -6 android/app/src/main/AndroidManifest.xml

      - name: Verify core files
        run: |
          test -f lib/deepseek_service.dart && echo "deepseek_service.dart OK"
          test -f lib/deepseek_sheet.dart && echo "deepseek_sheet.dart OK"
          test -f lib/empire_page.dart && echo "empire_page.dart OK"
          test -f lib/empire_data.dart && echo "empire_data.dart OK"
          test -f lib/empire_assets.dart && echo "empire_assets.dart OK"
          # 帝国模块的领地图与示例数据已编成 Dart 常量，构建不再依赖 assets/ 目录
          ! grep -q "^  assets:" pubspec.yaml && echo "no asset bundle dependency OK"

      - name: Get dependencies
        run: flutter pub get

      - name: Force all plugins and app to compileSdk 36
        run: |
          # 1. 修改 App 自身的 build.gradle / build.gradle.kts
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk .*/compileSdk 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' android/app/build.gradle
          fi

          # 2. 直接把所有第三方插件（包括 file_picker）里的 33/34/35 和变量全部替换为 36
          find ~/.pub-cache/ -name "build.gradle" -type f -exec sed -i -E 's/compileSdkVersion [0-9]+/compileSdkVersion 36/g' {} + || true
          find ~/.pub-cache/ -name "build.gradle" -type f -exec sed -i -E 's/compileSdk [0-9]+/compileSdk 36/g' {} + || true
          find ~/.pub-cache/ -name "build.gradle" -type f -exec sed -i -E 's/compileSdk = [0-9]+/compileSdk = 36/g' {} + || true
          find ~/.pub-cache/ -name "build.gradle" -type f -exec sed -i 's/flutter.compileSdkVersion/36/g' {} + || true
          find ~/.pub-cache/ -name "build.gradle.kts" -type f -exec sed -i -E 's/compileSdk = [0-9]+/compileSdk = 36/g' {} + || true
          find ~/.pub-cache/ -name "build.gradle.kts" -type f -exec sed -i 's/flutter.compileSdkVersion/36/g' {} + || true

      - name: Build Release APK
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      # 失败时把关键报错塞进 check-run annotation：
      # 这样即使拿不到 blob 上的原始日志，也能从 API 直接读到原因。
      - name: Surface build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          p = '/tmp/build.log'
          if not os.path.exists(p):
              print('::error::build.log missing, build likely failed before gradle')
              raise SystemExit(0)
          s = open(p, encoding='utf-8', errors='ignore').read()
          lines = s.splitlines()
          keys = ('What went wrong', 'FAILURE:', 'e: ', 'error:', 'Execution failed', 'Caused by', 'Could not')
          idx = [i for i, l in enumerate(lines) if any(k in l for k in keys)]
          if idx:
              start = max(0, idx[0] - 15)
              chunk = '\n'.join(lines[start:start + 150])
          else:
              chunk = '\n'.join(lines[-100:])
          chunk = chunk[:55000]
          print('--- BUILD ERROR CONTEXT ---')
          print(chunk)
          print('::error::' + chunk.replace('\n', '%0A'))
          PY

      # 签名必须和上一版一致，否则用户覆盖安装会失败、数据全丢。
      # 只「配置了密钥」不够：模板写法一变，替换就可能静默落空，所以这里直接验指纹。
      # 签名必须和上一版一致，否则用户覆盖安装会失败、数据全丢。
      # 只「配置了密钥」不够：模板写法一变，替换就可能静默落空，所以这里直接验指纹。
      # 用 apksigner 而不是 keytool：现在的 APK 只有 v2/v3 签名，keytool 读 JAR 签名会读不到。
      - name: Verify release signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          fi
          echo "apksigner: $APKSIGNER"
          FP=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | sed 's/.*digest: *//' | tr 'A-Z' 'a-z')
          echo "APK cert SHA256: $FP"
          echo "::notice title=APK 签名指纹::$FP"
          EXPECT=4bfb378ae858b520e6f30b8550d4eb66fa454a121d0bacf4adadbb7c21f01868
          if [ "$FP" != "$EXPECT" ]; then
            echo "::error::APK 没用固定密钥签名（$FP），覆盖升级会失败"
            exit 1
          fi

      # 把 APK 直接挂到 Release 上：Actions 产物要登录才能下，Release 是公开直链。
      # 只在 Empire-V4.1 分支上做，避免别的分支乱发版。
      - name: Attach APK to release
        if: github.ref_name == 'Empire-V4.1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=V4.1.0
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --title "帝国 V4.1.0 · 站内播放 + 复制即弹"
          gh release upload "$TAG" build/app/outputs/flutter-apk/app-release.apk --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) \(.browserDownloadUrl)"'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
