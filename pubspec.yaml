name: daily_tracker
description: 纯本地个人信息管理工具
publish_to: 'none'
version: 4.6.0+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  image_picker: ^1.1.2
  archive: ^3.6.1
  file_picker: ^8.1.4
  share_plus: ^10.0.2
  intl: ^0.19.0
  uuid: ^4.5.0
  webview_flutter: ^4.10.0
  # 用来关掉「必须用户手势」的限制，否则流里自动播放会被 WebView 拦掉
  webview_flutter_android: ^4.3.2

flutter:
  uses-material-design: true
